[package]
name = "plugin-transport-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "HS2-XE0ZVB benchmark: JSON-RPC/stdio vs protobuf/stdio vs gRPC/UDS for out-of-process plugins."

# Standalone: not a workspace member.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
prost = "0.13.3"
tonic = "0.12.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }

[build-dependencies]
tonic-build = "0.12.3"
protoc-bin-vendored = "3"

[profile.release]
debug = false
