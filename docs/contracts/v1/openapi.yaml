  /permissions:
    get:
      operationId: listPermissions
      responses:
        '200':
          description: Pending permission requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /ws/poll:
    get:
      operationId: pollChanges
      security:
        - HotsheetSecret: []
        - HotsheetQuerySecret: []
      description: Omit since for a no-backlog handshake. With since, events have cursors greater than that value. On
        overflow, fetch a full ticket list before continuing from the returned cursor. The cursor is process-local.
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
        - name: timeout_ms
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 55000
        - name: checkout
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Replay envelope.
          content:
            application/json:
              schema:
                $ref: poll-envelope.schema.json
  /ws/sync:
    get:
      operationId: subscribeChanges
      description:
        WebSocket upgrade. Pass secret as a query parameter because browser WebSocket clients cannot set the usual
        secret header. Each text frame is one change event; this transport has no initial replay.
      security:
        - HotsheetQuerySecret: []
      parameters:
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: checkout
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
      responses:
        '101':
          description: WebSocket upgrade; text frames follow change-event.schema.json.
