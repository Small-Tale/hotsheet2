components:
  securitySchemes:
    HotsheetSecret:
      type: apiKey
      in: header
      name: X-Hotsheet-Secret
    HotsheetQuerySecret:
      type: apiKey
      in: query
      name: secret
  parameters:
    CheckoutReference:
      name: reference
      in: path
      required: true
      schema:
        type: string
    Connection:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
    NativeId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    FullTicket:
      description: Full provider-neutral ticket, including notes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ticket'
  schemas:
    Compatibility:
      type: object
      required:
        - generation
        - application_version
        - build_revision
        - source_revision
        - source_stale
        - protocol
        - store_schema
        - capabilities
        - started_at
        - launcher
        - executable
      properties:
        generation:
          const: hs2
        application_version:
          type: string
        build_revision:
          type:
            - string
            - 'null'
        source_revision:
          type:
            - string
            - 'null'
        source_stale:
          type: boolean
        protocol:
          $ref: '#/components/schemas/VersionRange'
        store_schema:
          $ref: '#/components/schemas/VersionRange'
        capabilities:
          type: object
          required:
            - lifecycle_restart
            - lifecycle_quiescence
          properties:
            lifecycle_restart:
              type: boolean
            lifecycle_quiescence:
              type: boolean
        started_at:
          type:
            - string
            - 'null'
        launcher:
          type: string
        executable:
          type:
            - string
            - 'null'
      additionalProperties: true
    VersionRange:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: integer
        max:
          type: integer
    TicketRow:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
      additionalProperties: true
    CheckoutTicketPage:
      type: object
      required:
        - items
        - counts
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketRow'
        next_cursor:
          type: string
        counts:
          oneOf:
            - type: object
            - type: 'null'
        source_errors:
          type: array
          items:
            type: string
      additionalProperties: true
    Ticket:
      type: object
      required:
        - connection_id
        - native_id
        - qualified_id
        - slug
        - title
        - status
        - notes
      properties:
        connection_id:
          type: string
        native_id:
          type: string
        qualified_id:
          type: string
        slug:
          type: string
        title:
          type: string
        status:
          type: string
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
      additionalProperties: true
    Note:
      type: object
      required:
        - id
        - kind
        - created_at
        - edited_at
        - human_edited
        - text
      properties:
        id:
          type: string
        hotsheet_note_id:
          type: string
        kind:
          enum:
            - regular
            - activity
            - feedback_needed
            - status
        created_at:
          type: string
        edited_at:
          type: string
        summary:
          type: string
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        feedback_for:
          type: string
        human_edited:
          type: boolean
        text:
          type: string
        feedback_request:
          type: boolean
        response_to:
          type: string
        actor:
          type: object
          required:
            - role
          properties:
            role:
              enum:
                - human
                - ai
                - system
            id:
              type: string
      additionalProperties: true
