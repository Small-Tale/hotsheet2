openapi: 3.1.0
info:
  title: Hot Sheet client HTTP API
  version: 1.0.0
  description: Server-owned contracts consumed by browser and native clients. Paths are relative to the Hot Sheet server
    origin or the checkout-scoped bridge origin. Unknown response members may be added without changing this contract
    version.
security:
  - HotsheetSecret: []
paths:
  /compatibility:
    get:
      operationId: getCompatibility
      responses:
        '200':
          description: Build and protocol compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
  /checkouts/{reference}/tickets:
    parameters:
      - $ref: '#/components/parameters/CheckoutReference'
    get:
      operationId: listCheckoutTickets
      description:
        Without page_size this returns an array, capped by the server. With page_size it returns a cursor page.
        Clients must not treat a missing next_cursor as an empty string.
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
        - name: counts
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Compact rows or bounded cursor page.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/TicketRow'
                  - $ref: '#/components/schemas/CheckoutTicketPage'
    post:
      operationId: create_checkout_ticket
      responses:
        '201':
          description: Server-owned response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: The request failed; code is present for errors with a stable machine-readable identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: The request failed; code is present for errors with a stable machine-readable identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The request failed; code is present for errors with a stable machine-readable identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: The request failed; code is present for errors with a stable machine-readable identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        default:
          description: The request failed; code is present for errors with a stable machine-readable identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicket'
      parameters:
        - name: source
          in: query
          schema:
            type: string
        - name: store
          in: query
          schema:
            type: string
  /providers/{connection_id}/tickets:
    parameters:
      - $ref: '#/components/parameters/Connection'
    get:
      operationId: listProviderTickets
      responses:
        '200':
          description: Full provider tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      operationId: createProviderTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/FullTicket'
  /providers/{connection_id}/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Connection'
      - $ref: '#/components/parameters/NativeId'
    get:
      operationId: getProviderTicket
      responses:
        '200':
          $ref: '#/components/responses/FullTicket'
    patch:
      operationId: updateProviderTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
