openapi: 3.1.0
info:
  title: Hot Sheet client HTTP API
  version: 1.0.0
  description: Server-owned contracts consumed by browser and native clients. Paths are relative to the Hot Sheet server
    origin or the checkout-scoped bridge origin. Unknown response members may be added without changing this contract
    version.
security:
  - HotsheetSecret: []
paths:
  /compatibility:
    get:
      operationId: getCompatibility
      responses:
        '200':
          description: Build and protocol compatibility metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
  /checkouts/{reference}/tickets:
    parameters:
      - $ref: '#/components/parameters/CheckoutReference'
    get:
      operationId: listCheckoutTickets
      description:
        Without page_size this returns an array, capped by the server. With page_size it returns a cursor page.
        Clients must not treat a missing next_cursor as an empty string.
      parameters:
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          schema:
            type: string
        - name: counts
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Compact rows or bounded cursor page.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/TicketRow'
                  - $ref: '#/components/schemas/CheckoutTicketPage'
    post:
      operationId: create_checkout_ticket
      x-hotsheet-contract-depth: route-only
      responses:
        default:
          description: Response shape still follows the server handler and wire DTO.
  /providers/{connection_id}/tickets:
    parameters:
      - $ref: '#/components/parameters/Connection'
    get:
      operationId: listProviderTickets
      responses:
        '200':
          description: Full provider tickets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
    post:
      operationId: createProviderTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          $ref: '#/components/responses/FullTicket'
  /providers/{connection_id}/tickets/{id}:
    parameters:
      - $ref: '#/components/parameters/Connection'
      - $ref: '#/components/parameters/NativeId'
    get:
      operationId: getProviderTicket
      responses:
        '200':
          $ref: '#/components/responses/FullTicket'
    patch:
      operationId: updateProviderTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          $ref: '#/components/responses/FullTicket'
  /permissions:
    get:
      operationId: listPermissions
      responses:
        '200':
          description: Pending permission requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /ws/poll:
    get:
      operationId: pollChanges
      security:
        - HotsheetSecret: []
        - HotsheetQuerySecret: []
      description: Omit since for a no-backlog handshake. With since, events have cursors greater than that value. On
        overflow, fetch a full ticket list before continuing from the returned cursor. The cursor is process-local.
      parameters:
        - name: since
          in: query
          schema:
            type: integer
            minimum: 0
        - name: timeout_ms
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 55000
        - name: checkout
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Replay envelope.
          content:
            application/json:
              schema:
                $ref: poll-envelope.schema.json
  /ws/sync:
    get:
      operationId: subscribeChanges
      description:
        WebSocket upgrade. Pass secret as a query parameter because browser WebSocket clients cannot set the usual
        secret header. Each text frame is one change event; this transport has no initial replay.
      security:
        - HotsheetQuerySecret: []
      parameters:
        - name: secret
          in: query
          required: true
          schema:
            type: string
        - name: checkout
          in: query
          schema:
            type: string
        - name: client
          in: query
          schema:
            type: string
      responses:
        '101':
          description: WebSocket upgrade; text frames follow change-event.schema.json.
  /tickets:
    get:
      operationId: list_tickets
      x-hotsheet-contract-depth: route-only
      responses:
        default:
          description: Response shape still follows the server handler and wire DTO.
    post:
