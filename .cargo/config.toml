[alias]
lint = "clippy --config build.target-dir=\"target/clippy\" --workspace --all-targets --all-features -- -D warnings -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented"
# HS2-H37V5P: the desktop shell is its own Cargo workspace, so `cargo lint` never reaches it.
# Same deny set; run from the repository root. Its build script needs the staged sidecars
# (`npm run desktop:prepare`), or locally merge
# TAURI_CONFIG='{"bundle":{"externalBin":[],"resources":null}}' to lint without staging.
lint-desktop = "clippy --manifest-path clients/web/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings -D clippy::dbg_macro -D clippy::todo -D clippy::unimplemented"

# HS2-T9VXEP: every process cargo or cargo-nextest launches (test binaries, build
# scripts, `cargo run`) gets a repository-local machine home. Hot Sheet-launched agent
# sessions export HOTSHEET_HOME as the maintainer's real `~/.hotsheet2`; without `force`
# that inherited value would let any test that forgets its own temp home write the real
# checkouts.json, settings.json, or settings-locks. Tests that need a fresh home still
# pass their own temp directory explicitly. Binaries run directly from target/ are
# unaffected.
[env]
HOTSHEET_HOME = { value = "target/test-hotsheet-home", force = true, relative = true }
# HS2-SDPD95: the same protection for the machine cache. Without it, a test whose AppState
# keeps the default cache root would write video posters into the real platform cache
# (`~/Library/Caches/hotsheet2` on macOS). Tests that assert cache contents still inject
# their own temp directory with `AppState::with_cache_dir`.
HOTSHEET_CACHE_DIR = { value = "target/test-hotsheet-cache", force = true, relative = true }
# HS2-7W3D7V: AI-tool discovery would otherwise execute the developer's installed tools
# (`codex --version`, the Codex app-server `model/list`, `opencode models`, `agy models`)
# with their real credentials and network access whenever a test starts a server or CLI
# with the inherited PATH. Tests keep the bundled offline catalogs; the few that exercise
# probing against fixture tools remove this variable explicitly.
HOTSHEET_AI_TOOL_PROBES = { value = "off", force = true }
# HS2-DTAVQA: a spawned server would otherwise sample this host (disk, battery, network) and
# push host-dependent `host_health` change events into every test's change stream. Tests
# drive the sampler through an injected source instead.
HOTSHEET_HOST_HEALTH_SAMPLER = { value = "off", force = true }
# HS2-M269HC: a repository-local global Git config. Git otherwise starts detached
# `git maintenance run --auto` children after fetch, push, commit and receive-pack that
# outlive tests (788 per full suite), and tests would read each developer's global config.
# GIT_CONFIG_GLOBAL survives `git::command`'s repository-env scrub and local transports.
GIT_CONFIG_GLOBAL = { value = ".cargo/test-gitconfig", force = true, relative = true }
# HS2-PN848F: setup registers an absolute Hot Sheet MCP override in Claude Code's local
# scope (the user's `.claude.json`) when a project's `.mcp.json` is shared. Without this,
# any test that sets up Claude against a shared config would edit the developer's real
# `~/.claude.json`. Tests that assert the override pass their own file.
HOTSHEET_CLAUDE_USER_CONFIG = { value = "target/test-claude-user-config/.claude.json", force = true, relative = true }
# HS2-HYF56Y: the terminal launch relay installs a per-user LaunchAgent. No test may load,
# unload, or write one for real: `launchctl` resolves to a path that does not exist (tests
# that drive install inject a fake), and the agents directory stays under `target/`.
HOTSHEET_LAUNCHCTL = { value = "target/test-launchctl-disabled/launchctl", force = true, relative = true }
HOTSHEET_LAUNCH_AGENTS_DIR = { value = "target/test-launch-agents", force = true, relative = true }
