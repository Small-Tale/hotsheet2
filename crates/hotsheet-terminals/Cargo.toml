[package]
name = "hotsheet-terminals"
description = "Hot Sheet 2 terminal/PTY manager: per-project PTYs, scrollback, busy inference."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hotsheet-terminal-broker"
path = "src/bin/broker.rs"

# A deterministic PTY-byte emulator for terminal E2E tests (HS2-1GJY50).
[[bin]]
name = "hs-fake-agent"
path = "src/bin/fake_agent.rs"

[dependencies]
portable-pty.workspace = true
thiserror.workspace = true
# A live output fan-out so a WS viewer streams new bytes as they arrive (HS2-XTTTMV).
# tokio also drives the detached broker's Unix-socket server (HS2-8HHFHN); `io-util` for the
# line-delimited framing.
tokio = { workspace = true, features = ["io-util", "time"] }
# The detached-broker IPC protocol (HS2-8HHFHN).
serde = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
