[package]
name = "hotsheet-resource-claims"
description = "Hot Sheet 2 resource claims: a backend contract for leasing a named resource, with a local machine backend."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# One canonical path spelling, never Windows verbatim (HS2-ECJ188).
hotsheet-sync.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
time.workspace = true
base64.workspace = true
ring.workspace = true
tempfile.workspace = true
toml.workspace = true
ureq.workspace = true
hotsheet-http.workspace = true
# HS2-BR14FM: a warning when a claim plugin leaves a process running.
tracing.workspace = true
hotsheet-ticketing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# HS2-CYDK9Z: a plugin runs in the shared Windows job object that holds its process tree.
[target.'cfg(windows)'.dependencies]
hotsheet-process-journal.workspace = true

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
