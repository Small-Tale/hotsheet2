[package]
name = "hotsheet-process-journal"
description = "Bounded machine-local child-process provenance without commands or credentials."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hotsheet-sync.workspace = true
# HS2-3EZ1GR: finish and prune serialize through a process-shared FileLock; macOS
# detached launches also resolve their program through git::program_path (HS2-Y4VDBK).
hotsheet-ticketing.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# HS2-8CGT4R: a detached launch marks the launcher's standard handles not inheritable.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
