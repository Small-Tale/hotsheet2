[package]
name = "hotsheet-cli"
description = "Hot Sheet 2 command-line interface: init/new/ls/show/import."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
# Named `hotsheet-cli` (not `hotsheet`) to avoid colliding on PATH with a separately
# installed Hot Sheet (HS1) `hotsheet` launcher during development.
name = "hotsheet-cli"
path = "src/main.rs"

[dependencies]
hotsheet-model.workspace = true
hotsheet-ticketing.workspace = true
hotsheet-plugins.workspace = true
clap.workspace = true
anyhow.workspace = true
ulid.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
time.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
