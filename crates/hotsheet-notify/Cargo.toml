[package]
name = "hotsheet-notify"
description = "Hot Sheet 2 notifier plugins: capability-aware delivery of notifications to speech, ntfy, email, and external channels."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
ulid.workspace = true
time.workspace = true
jiff.workspace = true
base64.workspace = true
sha2.workspace = true
ring.workspace = true
percent-encoding.workspace = true
# HS2-9ABVDW: still on ureq 2 until this crate moves to hotsheet-http.
ureq = "2.12"
tempfile.workspace = true
# HS2-BWJWWX: a blocking WebSocket client for the Ably adapter. TLS is built explicitly
# with the ring provider (the tree also holds aws-lc-rs, so the default builder would panic).
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls.workspace = true
webpki-roots.workspace = true
hotsheet-ticketing.workspace = true
hotsheet-sync.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "webpki-roots", "hostname"] }

[dev-dependencies]
tempfile.workspace = true
