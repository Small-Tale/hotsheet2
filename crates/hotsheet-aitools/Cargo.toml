[package]
name = "hotsheet-aitools"
description = "Hot Sheet 2 AI-tool host: the drive/transport interface (behavioral half of the plugin system)."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hotsheet-sync.workspace = true
hotsheet-plugins.workspace = true
# Every launched AI tool drops inherited repository-locating GIT_* vars (git::launch, HS2-J79CZF).
hotsheet-ticketing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# IsolatedCodexHome (launch safety) makes a throwaway CODEX_HOME at runtime, not just tests.
tempfile.workspace = true
# IsolatedCodexHome writes the isolated `config.toml` (MCP-free) for a driven codex.
toml.workspace = true
# The shared-daemon transport (UdsWsTransport): the codex app-server control socket
# speaks a plain WebSocket carrying text-frame JSON-RPC, so we frame over a Unix socket.
tokio = { workspace = true, features = ["time"] }
# Bounded tool probes kill a hung probe's whole process group (HS2-BH3M53).
libc.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
# Session push (HS2-PEJ962): loopback HTTP calls into a launched tool's own session API.
ureq.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
