[package]
name = "hotsheet-desktop"
version = "0.1.0"
description = "Hot Sheet 2 desktop client"
authors = ["Small Tale Inc."]
license = "MIT"
repository = "https://github.com/Small-Tale/hotsheet2"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hotsheet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "=2.12.5", features = [] }

[workspace]
