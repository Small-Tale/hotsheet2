# First-party Hot Sheet plugin for Google Antigravity (the `agy` CLI, Gemini-based).
# Loaded through the same loader as any plugin. Antigravity is the WEAKEST-driving tool
# (docs/13 §13.0): no persistent daemon — spawn-per-turn with conversation resume.

id = "antigravity"
display_name = "Antigravity"
product_name = "Antigravity"
tier = "cli-agent"

[detection]
binaries = ["agy"]

[instructions]
# Antigravity reads AGENTS.md (shared cross-tool convention). Verify against agy's docs.
target = "AGENTS.md"
section = "instructions.md"

# No [skills] — Antigravity does not currently expose a project-local skill convention.

[mcp]
# Antigravity CONSUMES MCP via a standard `mcpServers` object (official docs); the
# workspace config lives at .agents/mcp_config.json — same JSON shape as .mcp.json.
target = ".agents/mcp_config.json"
format = "claude-json"
server_name = "hotsheet"
command = "hotsheet-mcp"
args = ["--path", "{store}"]

[drive]
# agy has no daemon (docs/13 §13.0): spawn per turn, but resume the conversation so a
# trigger continues the same thread — agy --conversation <id> --print "<prompt>".
transport = "spawn"
program = "agy"
args = ["--print"]
content = "arg"
interrupt = true
resume_flag = "--conversation"
# The IDE also installs an `agy` launcher. Only probe the documented native CLI
# install at the default path; other launchers keep this bundled catalog.
model_catalog_args = ["models"]
model_catalog_identity = "native-default-install"
models = [
  { id = "gemini-3.8-flash-medium", label = "Gemini 3.8 Flash (Medium)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.8-flash-high", label = "Gemini 3.8 Flash (High)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.7-flash-medium", label = "Gemini 3.7 Flash (Medium)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.7-flash-high", label = "Gemini 3.7 Flash (High)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.6-flash-medium", label = "Gemini 3.6 Flash (Medium)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.6-flash-high", label = "Gemini 3.6 Flash (High)", effort_levels = ["low", "medium", "high"] },
  { id = "gemini-3.1-pro-high", label = "Gemini 3.1 Pro (High)", effort_levels = ["low", "medium", "high"] },
]
default_model = "gemini-3.8-flash-medium"
default_effort = "medium"
model_flag = "--model"
effort_flag = "--effort"
runtime_effort_levels = ["low", "medium", "high"]
runtime_default_effort = "medium"
session_options = ["model", "effort"]

[launch]
program = "agy"
args = []
