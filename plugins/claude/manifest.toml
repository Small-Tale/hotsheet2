# First-party Hot Sheet plugin for Claude Code. This is a normal plugin manifest —
# the same shape a third-party plugin uses (docs/05 §5.11); Claude is not special-
# cased in the core, it is loaded through the plugin loader like any other tool.

id = "claude"
display_name = "Claude"
product_name = "Claude Code"
# `cli-agent` = Hot Sheet can drive it; `editor` = context files only (docs/05 §5.3).
tier = "cli-agent"

[detection]
# How the host decides this tool is present on the machine (docs/05 §5.3).
binaries = ["claude"]

[instructions]
# The tool's managed instruction file, and the plugin file holding the Hot Sheet
# section to merge into it (delimited + refreshed in place by `hotsheet-cli setup`).
target = "CLAUDE.md"
section = "instructions.md"

[skills]
# Where the worklist skill is written in the project, and its source in this plugin.
target = ".claude/skills/hotsheet/SKILL.md"
source = "SKILL.md"

[mcp]
# The tool's MCP config file + how the hotsheet server is registered in it. `{store}`
# is substituted with the project's store path at setup time (serverless `--path`).
target = ".mcp.json"
format = "claude-json"
server_name = "hotsheet"
command = "hotsheet-mcp"
args = ["--path", "{store}"]

[drive]
# Claude is driven the HS1 play-button way: a turn injected into a running `claude`
# stream-json session (docs/13 §13.6). transport = claude-channel; the host owns the
# live process, so `program`/`args` here are informational (the drive uses the injected
# ClaudeChannelClient, not this launch line). No interrupt in phase 1 (HS2-116).
transport = "claude-channel"
program = "claude"
args = ["-p", "--input-format", "stream-json", "--output-format", "stream-json"]
content = "stdin"
interrupt = false

[launch]
# Interactive REPL; intentionally not the headless stream-json drive command above.
program = "claude"
args = []

[metrics]
# Claude reports token usage on its stream-json `result` event; the host maps it to a
# UsageEvent (docs/14, HS2-TJ8FGR). `source` selects the `claude_result_usage` parser.
source = "claude-usage"

[hooks]
# The PreToolUse permission hook (docs/05 §5.7, HS2-YMR9HE): Claude runs it before each
# tool use; it asks the running Hot Sheet server for an allow/deny (else defers to Claude).
target = ".claude/settings.json"
event = "PreToolUse"
command = "hotsheet-cli permission-hook"

[activity]
# Claude's PreToolUse/UserPromptSubmit/Stop hook events + transcript map to activity events
# (docs/15, HS2-KP31ZE). `source` selects the `claude_activity` mapper.
source = "claude-hooks"
