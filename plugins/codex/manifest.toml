# First-party Hot Sheet plugin for Codex CLI. Loaded through the same loader as any
# other plugin (docs/05 §5.11) — and deliberately a different SHAPE than Claude, to
# keep the plugin interface honest (docs/05 §5.1): AGENTS.md instead of CLAUDE.md, no
# skills concept, and a TOML MCP config instead of JSON.

id = "codex"
display_name = "Codex"
product_name = "Codex CLI"
tier = "cli-agent"

[detection]
binaries = ["codex"]

[instructions]
# Codex reads AGENTS.md; same merge-safe managed-block mechanism as CLAUDE.md.
target = "AGENTS.md"
section = "instructions.md"

# NOTE: no [skills] table — Codex has no skills concept. The loader treats the
# skills capability as absent (docs/05 §5.3, "absence is the signal").

[mcp]
# Codex stores MCP servers as TOML under [mcp_servers.<name>] in $CODEX_HOME/config.toml
# (default ~/.codex). `format = "codex-toml"` selects the host's TOML writer; setting
# CODEX_HOME=<project>/.codex makes it project-scoped. `{store}` is substituted at setup.
target = ".codex/config.toml"
format = "codex-toml"
server_name = "hotsheet"
command = "hotsheet-mcp"
args = ["--path", "{store}"]

[drive]
# How the host drives Codex (docs/13): the PERSISTENT app-server daemon — a play is a
# `turn/start` on a new/resumed thread, NOT a fresh process (codex 0.148 `app-server
# daemon`). The `codex exec resume <id> <prompt>` spawn path is a documented fallback.
transport = "app-server"
program = "codex"
args = ["app-server"]
content = "arg"
interrupt = true

[launch]
# Interactive REPL; intentionally not the headless app-server drive command above.
program = "codex"
args = []

[metrics]
# Codex reports token usage on its `turn/completed` notification; the host maps it to a
# UsageEvent (docs/14, HS2-8PSAFE). `source` selects the `codex_turn_usage` parser.
source = "codex-usage"
[activity]
# Codex's app-server turn transcript (start/item/end) maps to activity events (docs/15,
# HS2-KP31ZE). `source` selects the `codex_activity` mapper.
source = "codex-transcript"
