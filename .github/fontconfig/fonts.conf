<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  CI browser font pin (HS2-6H4M85). The web client uses the platform UI font (Web Awesome's
  `ui-sans-serif, system-ui, sans-serif`). On the Ubuntu runner that resolves to DejaVu Sans,
  which sets text about 15% wider than the macOS and Windows UI fonts the layout tests are
  calibrated against. Prefer the metric-compatible Liberation Sans (Arial metrics) instead.
-->
<fontconfig>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
