name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  webkit-popup:
    name: WebKit popup anchor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install web client dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install Playwright WebKit and Linux dependencies
        working-directory: clients/web
        run: |
          for attempt in 1 2; do
            if npx playwright install --with-deps webkit; then
              exit 0
            fi
            echo "::warning::WebKit dependency install attempt $attempt failed"
          done
          echo "::error::WebKit dependency install failed after two bounded attempts"
          exit 1

      - name: Verify popup anchor recovery in WebKit
        working-directory: clients/web
        timeout-minutes: 5
        run: npm run test:ci:webkit

  windows-credential-store:
    name: Windows Credential Manager
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show

      - name: Activate the MSVC compiler for native AVIF libraries
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-credentials-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-credentials-

      - name: Install the AVIF decoder for the native build
        shell: pwsh
        run: |
          python -m pip install meson ninja
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          & $vcpkg install dav1d:x64-windows-static-md pkgconf:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed'
          $pkgconf = Join-Path $installed 'x64-windows/tools/pkgconf/pkgconf.exe'
          $pkgconfig = Join-Path $installed 'x64-windows-static-md/lib/pkgconfig'
          if (!(Test-Path $pkgconf) -or !(Test-Path (Join-Path $pkgconfig 'dav1d.pc'))) {
            throw 'dav1d or pkgconf is missing from the vcpkg installation'
          }
          "PKG_CONFIG=$pkgconf" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$pkgconfig" >> $env:GITHUB_ENV

      - name: Compile and exercise the native credential adapter
        env:
          CC: cl
        run: cargo test -p hotsheet-ticketing windows_credential_manager_round_trip

      - name: Exercise trusted Antigravity CLI discovery on Windows
        env:
          CC: cl
        run: cargo test -p hotsheet-aitools --test antigravity_discovery

  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain
        run: rustup show # honors rust-toolchain.toml (adds rustfmt + clippy)

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install the AVIF decoder
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev meson ninja-build cmake nasm

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo lint

      - name: Test
        run: cargo nextest run --all-features

      # Node side: the migrator + the cross-language conformance test (docs/12 §12.7).
      # Node version is pinned in .nvmrc so CI matches local dev.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            clients/web/package-lock.json
            migrator/package-lock.json
            spikes/kerf-webawesome/package-lock.json

      - name: Validate feature double-coverage matrix
        run: node --test scripts/check-test-coverage.test.mjs && node scripts/check-test-coverage.mjs

      - name: Test the quiet test wrapper and the slow-test profiler
        run: node --test scripts/test-quiet.test.mjs scripts/test-profile.test.mjs

      - name: Validate the flaky-test quarantine list
        run: node --test scripts/check-test-quarantine.test.mjs && node scripts/check-test-quarantine.mjs

      # nextest writes this JUnit report on every run (.config/nextest.toml, HS2-3PX1E4).
      - name: Slowest Rust tests
        if: always()
        run: node scripts/test-profile.mjs --top 15 --nextest target/nextest/default/junit.xml || true

      - name: Build the CLI (the conformance test drives target/debug/hotsheet-cli)
        run: cargo build --bin hotsheet-cli

      - name: Install web client dependencies
        working-directory: clients/web
        run: npm ci

      - name: Install Playwright Chromium and Linux dependencies
        working-directory: clients/web
        run: |
          # apt mirrors can stall during --with-deps; keep the gate bounded and retry a transient failure.
          for attempt in 1 2; do
            if timeout --kill-after=15s 6m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright dependency install attempt $attempt failed or timed out"
          done
          echo "::error::Playwright dependency install failed after two bounded attempts"
          exit 1

      - name: Web client lint, typecheck, unit tests, and production build
        working-directory: clients/web
        run: |
          npm run lint
          npm run typecheck
          npm run test:unit -- --reporter=default --reporter=json --outputFile.json=target/vitest-report.json
          npm run build

      - name: Slowest web unit tests
        if: always()
        working-directory: clients/web
        run: node ../../scripts/test-profile.mjs --top 15 --vitest target/vitest-report.json || true

      - name: Web Chromium smoke flows
        working-directory: clients/web
        timeout-minutes: 12
        env:
          HOTSHEET_MEDIA_TEST_VIDEO: tests/fixtures/video-scrub.mp4
        run: npm run test:ci:browser

      - name: Migrator tests + coverage (vitest + Rust-import conformance)
        working-directory: migrator
        # `test:coverage` runs the same suite under v8 coverage and fails under the
        # per-language thresholds in vitest.config.mjs (HS2-8WR8XF). Its own summary — NOT
        # merged into the Rust lcov.
        run: |
          npm ci
          npm run lint
          npm run test:coverage

      - name: Kerf + Web Awesome spike lint, typecheck, and build
        working-directory: spikes/kerf-webawesome
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Upload migrator coverage (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-coverage-lcov
          path: migrator/coverage/lcov.info
          if-no-files-found: ignore

  # Per-language coverage (docs/12 §12.7.5): a separate Rust summary, NOT one merged lcov.
  # Now GATED on a conservative line floor (HS2-8WR8XF) — a real gate that catches a
  # coverage collapse without being flaky. Raise the floor as measured runs settle.
  coverage:
    name: coverage (Rust, gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain + llvm-tools
        run: rustup show && rustup component add llvm-tools-preview

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Install the AVIF decoder
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev meson ninja-build cmake nasm

      - name: Collect Rust coverage
        # `-D warnings` breaks coverage instrumentation builds; unset it here. `--no-report`
        # runs the tests + collects profiles once; the report/gate steps reuse them.
        env:
          RUSTFLAGS: ''
        run: cargo llvm-cov nextest --all-features --no-report

      - name: Rust coverage lcov (artifact)
        env:
          RUSTFLAGS: ''
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload lcov
        # Upload before the gate so the artifact exists even when the threshold fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

      - name: Rust coverage summary + threshold gate
        env:
          RUSTFLAGS: ''
        # Baseline measured at ~85.8% lines (HS2-8WR8XF); floor set a few points under so
        # a real regression fails the job without flaking on normal fluctuation. Raise as
        # coverage climbs.
        run: cargo llvm-cov report --summary-only --fail-under-lines 80

  # The full Playwright suite, sharded (HS2-D95TXJ). Locally agents run only the specs a
  # ticket affects; this job verifies the whole browser suite during the `final_testing`
  # handoff. `--fully-parallel` balances shards at the test level (the suite has no
  # serial or beforeAll-coupled tests). Non-blocking until it has run green on main
  # (HS2-6H4M85 makes it required); its result is still visible on every run.
  browser-full:
    name: Full Playwright suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-browser-
            ${{ runner.os }}-cargo-

      - name: Install the AVIF decoder
        run: sudo apt-get update && sudo apt-get install -y libdav1d-dev meson ninja-build cmake nasm

      - name: Build the CLI and server that the real-server flows spawn
        run: cargo build -p hotsheet-cli -p hotsheet-server --bins

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install web client dependencies
        working-directory: clients/web
        run: npm ci

      - name: Read the installed Playwright version
        id: playwright
        working-directory: clients/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The suite launches only Chromium and WebKit: the Firefox PTY profiler is opt-in and skips
      # at file level unless HOTSHEET_FIREFOX_PTY_PROFILE=1.
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install Playwright Chromium, WebKit, and Linux dependencies
        working-directory: clients/web
        run: |
          # A cached browser is not downloaded again; --with-deps still installs the apt packages.
          # apt mirrors can stall, so each attempt is bounded and a transient failure is retried.
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 8m npx playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::Playwright dependency install attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::Playwright dependency install failed after three bounded attempts"
          exit 1

      # The runner's default sans-serif, DejaVu Sans, sets text about 15% wider than the macOS
      # and Windows UI fonts the layout specs are calibrated against (HS2-6H4M85).
      - name: Pin the browsers' UI font to metric-compatible Liberation Sans
        run: |
          sudo apt-get install -y fonts-liberation
          mkdir -p ~/.config/fontconfig
          cp .github/fontconfig/fonts.conf ~/.config/fontconfig/fonts.conf
          fc-match system-ui | grep -q 'Liberation Sans'

      - name: Run shard ${{ matrix.shard }} of the full suite
        working-directory: clients/web
        timeout-minutes: 35
        env:
          HOTSHEET_MEDIA_TEST_VIDEO: tests/fixtures/video-scrub.mp4
        run: npx playwright test --shard=${{ matrix.shard }}/4 --fully-parallel --workers=2 --reporter=blob

      - name: Upload the shard's blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: clients/web/blob-report
          retention-days: 7
          if-no-files-found: ignore

  browser-full-report:
    name: Full Playwright suite (merged report)
    needs: browser-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Install web client dependencies
        working-directory: clients/web
        run: npm ci

      - name: Download the shard blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: clients/web/all-blob-reports
          merge-multiple: true

      - name: Merge the shard reports
        working-directory: clients/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: npx playwright merge-reports --reporter=html,json,list ./all-blob-reports

      - name: Slowest browser tests
        working-directory: clients/web
        run: node ../../scripts/test-profile.mjs --top 20 --playwright playwright-report.json || true

      - name: Upload the merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: clients/web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
