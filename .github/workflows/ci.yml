name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain
        run: rustup show # honors rust-toolchain.toml (adds rustfmt + clippy)

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo nextest run --all-features

      # Node side: the migrator + the cross-language conformance test (docs/12 §12.7).
      # Node version is pinned in .nvmrc so CI matches local dev.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: migrator/package-lock.json

      - name: Build the CLI (the conformance test drives target/debug/hotsheet-cli)
        run: cargo build --bin hotsheet-cli

      - name: Migrator tests (vitest + Rust-import conformance)
        working-directory: migrator
        run: |
          npm ci
          npx vitest run

  # Per-language coverage (docs/12 §12.7.5): report-only for now — a separate summary,
  # NOT one merged lcov. Threshold gates + migrator/web coverage are HS2-8WR8XF.
  coverage:
    name: coverage (Rust, report-only)
    runs-on: ubuntu-latest
    # A red coverage report must never block a PR while it's non-gating.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain + llvm-tools
        run: rustup show && rustup component add llvm-tools-preview

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov + nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Rust coverage summary
        # `-D warnings` breaks coverage instrumentation builds; unset it here.
        env:
          RUSTFLAGS: ""
        run: cargo llvm-cov nextest --all-features --summary-only

      - name: Rust coverage lcov (uploaded as an artifact)
        env:
          RUSTFLAGS: ""
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: lcov.info
