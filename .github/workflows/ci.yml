name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure a git identity (tests create + commit git stores)
        run: |
          git config --global user.name "Hot Sheet CI"
          git config --global user.email "ci@smalltale.invalid"

      - name: Install the pinned toolchain
        run: rustup show # honors rust-toolchain.toml (adds rustfmt + clippy)

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo nextest run --all-features

      # Node side: the migrator + the cross-language conformance test (docs/12 §12.7).
      # Node version is pinned in .nvmrc so CI matches local dev.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: migrator/package-lock.json

      - name: Build the CLI (the conformance test drives target/debug/hotsheet-cli)
        run: cargo build --bin hotsheet-cli

      - name: Migrator tests (vitest + Rust-import conformance)
        working-directory: migrator
        run: |
          npm ci
          npx vitest run
