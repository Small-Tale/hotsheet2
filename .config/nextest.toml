# HS2-TT8E7S: a hung test is terminated and fails after ten minutes instead of holding a
# CI job until its own timeout (a native-Windows Code Review test once ran for the whole
# 6 h Platforms job). SLOW is still reported every minute. Healthy tests finish in well
# under one minute on CI runners; the slowest seen locally under full load (a CLI hook
# test) took about four minutes, still inside the ten-minute limit. A timed-out
# test's captured output is printed, so its progress markers show where it stopped.
# HS2-237JQE: the hotsheet-cli coordination wake bound defaults to this period
# (pinned by `hs2_237jqe_default_wake_bound_is_the_nextest_slow_period`).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }
# HS2-FXF07C: nextest's 100ms default marked tests LEAKY under machine load when they start no
# thread or child at all (`binding_tests::capacity::hs2_4j6v46_private_registry_versions_and_
# byte_limits_preserve_original_bytes` and `binding_tests::ordering::hs2_4j6v46_late_success_...`
# while another full gate ran). A real leak, such as a detached `git maintenance` child
# (HS2-M269HC), holds the output pipes for seconds, so 500ms still reports it.
leak-timeout = "500ms"

# HS2-R6FZ54: native filesystem streams compete with process-heavy integration tests
# on macOS. Reserve the full global runner for each native watcher test while its
# stream starts, so load cannot make startup latency look like a lost event.
# HS2-BN9MMJ: consumer behaviour runs on the in-process stream; only the real-stream
# smoke tests of each module (and the platform adapter's own tests) are listed here.

[[profile.default.overrides]]
filter = '(package(hotsheet-server) & (test(watcher::freshness_tests::hs2_r6fz54_) | test(watcher::store_root_scope_tests::hs2_vn96j5_) | test(target_store_watch::tests::hs2_vn96j5_) | test(code_ref_watch::tests::hs2_bn9mmj_smoke_) | test(watcher::watcher_tests::hs2_bn9mmj_smoke_))) | (package(hotsheet-jobs) & (test(watch::tests::) | binary(waiter) | test(an_idle_monitor_step_wakes_no_watcher) | test(hs2_ecwg50_a_waiter_over_several_directories_wakes_on_each)))'
platform = 'cfg(target_os = "macos")'
threads-required = "num-test-threads"

# HS2-3PX1E4: keep a JUnit report of every run so slow tests are found from data:
#   node scripts/test-profile.mjs --nextest target/nextest/default/junit.xml
[profile.default.junit]
path = "junit.xml"
