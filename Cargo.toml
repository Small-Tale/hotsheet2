[workspace]
resolver = "3"
members = [
    "crates/hotsheet-model",
    "crates/hotsheet-ticketing",
    "crates/hotsheet-cli",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
authors = ["Small Tale Inc."]
repository = "https://github.com/Small-Tale/hotsheet2"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting"] }
tempfile = "3"

# internal
hotsheet-model = { path = "crates/hotsheet-model" }
hotsheet-ticketing = { path = "crates/hotsheet-ticketing" }
