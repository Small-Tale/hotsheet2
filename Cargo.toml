[workspace]
resolver = "3"
members = ["crates/hotsheet-model", "crates/hotsheet-ticketing"]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
authors = ["Small Tale Inc."]
repository = "https://github.com/Small-Tale/hotsheet2"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"

# internal
hotsheet-model = { path = "crates/hotsheet-model" }
