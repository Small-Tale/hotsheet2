[workspace]
resolver = "3"
members = [
    "crates/hotsheet-model",
    "crates/hotsheet-ticketing",
    "crates/hotsheet-cli",
    "crates/hotsheet-server",
    "crates/hotsheet-mcp",
    "crates/hotsheet-index",
    "crates/hotsheet-plugins",
    "crates/hotsheet-aitools",
]

[workspace.package]
edition = "2024"
version = "0.0.0"
license = "MIT"
authors = ["Small Tale Inc."]
repository = "https://github.com/Small-Tale/hotsheet2"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ulid = { version = "1", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tempfile = "3"
proptest = "1"
assert_cmd = "2"
predicates = "3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
notify = "6"
toml = "0.8"
include_dir = "0.7"

# internal
hotsheet-model = { path = "crates/hotsheet-model" }
hotsheet-ticketing = { path = "crates/hotsheet-ticketing" }
hotsheet-index = { path = "crates/hotsheet-index" }
hotsheet-plugins = { path = "crates/hotsheet-plugins" }
hotsheet-aitools = { path = "crates/hotsheet-aitools" }
